<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مساحة صفّي | نظام الإدارة الصفية للمرحلة الثانوية</title>

  <!-- Google Fonts: Cairo & Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'sans-serif'],
            tajawal: ['Tajawal', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              950: '#2e1065',
            },
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>

  <!-- Libraries: Lucide Icons, SheetJS (Excel), PDF.js, Mammoth (Word), JSZip (PPTX), QRCode.js, jsQR, Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Reduce Motion Support */
    .reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Print Styles for QR Cards & Certificates */
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        background: white !important;
        z-index: 999999 !important;
        padding: 12mm !important;
        margin: 0 !important;
        display: block !important;
      }
      .no-print { display: none !important; }
      .page-break { page-break-after: always; }
    }

    /* Traffic Light Glow */
    .light-glow-green { box-shadow: 0 0 28px rgba(34, 197, 94, 0.85); }
    .light-glow-yellow { box-shadow: 0 0 28px rgba(234, 179, 8, 0.85); }
    .light-glow-red { box-shadow: 0 0 28px rgba(239, 68, 68, 0.9); }

    /* Heart Pulse */
    @keyframes heartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    .animate-heart-pop { animation: heartPop 0.45s ease-out; }

    /* Card 3D Flip for Games */
    .box-card {
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }
    .box-card:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.02);
    }

    /* Sidebar gradient matching reference aesthetic */
    .sidebar-gradient {
      background: linear-gradient(180deg, #5b21b6 0%, #4c1d95 55%, #3b0764 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Hidden Print Container -->
  <div id="print-area" class="hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 left-5 z-[100] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Custom Confirm / Modal Dialog -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[90] hidden items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 transform transition-all">
      <div class="flex items-start justify-between gap-3 mb-3">
        <h3 id="modal-title" class="text-xl font-extrabold text-slate-900">تأكيد</h3>
        <button onclick="UI.closeModal()" class="p-2 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="text-slate-600 text-base leading-relaxed mb-6"></div>
      <div id="modal-actions" class="flex items-center justify-end gap-3"></div>
    </div>
  </div>

  <!-- Onboarding Wizard Modal -->
  <div id="onboarding-overlay" class="fixed inset-0 bg-brand-950/85 backdrop-blur-md z-[85] hidden items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-6 md:p-8 border border-brand-100 my-auto">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-amber-400 text-brand-950 flex items-center justify-center shadow-lg">
          <i data-lucide="sparkles" class="w-7 h-7"></i>
        </div>
        <div>
          <span class="text-xs font-bold text-brand-600 bg-brand-50 px-3 py-1 rounded-full">الإعداد السريع للمعلم</span>
          <h2 class="text-2xl font-black text-slate-900 mt-1">مرحبًا بك في مساحة صفّي</h2>
        </div>
      </div>

      <div class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">اسم المعلم / المعلمة *</label>
            <input id="ob-teacher-name" type="text" placeholder="مثال: أ. سارة العتيبي" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 outline-none font-bold" />
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">اسم المدرسة (اختياري)</label>
            <input id="ob-school-name" type="text" placeholder="مثال: ثانوية المستقبل" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">اسم المنصة المخصص</label>
            <input id="ob-platform-name" type="text" value="مساحة صفّي" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 outline-none font-bold" />
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">المنطقة الزمنية</label>
            <select id="ob-timezone" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 outline-none bg-white font-semibold"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">المادة الأساسية</label>
            <input id="ob-subject" type="text" placeholder="مثال: الفيزياء / الكيمياء / الرياضيات" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">اسم الفصل الأول</label>
            <input id="ob-class-name" type="text" placeholder="مثال: ثاني ثانوي - أ" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">أسماء طلاب الفصل (كل اسم في سطر — أو اتركه فارغًا للاستيراد لاحقًا)</label>
          <textarea id="ob-students" rows="3" placeholder="أحمد محمد السالم&#10;سارة عبدالله القحطاني&#10;نورة فهد الدوسري" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 outline-none text-sm"></textarea>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 mt-6 pt-4 border-t border-slate-100">
        <button onclick="App.loadDemoData(true)" class="px-4 py-3 rounded-xl bg-amber-50 text-amber-800 hover:bg-amber-100 font-bold text-sm flex items-center gap-2 transition">

  <!-- Main App Shell -->

    <!-- Right Sidebar (Desktop) & Drawer (Mobile/iPad) -->

      <div>
        <!-- Brand Header -->
        <div class="p-5 flex items-center justify-between border-b border-white/10">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-amber-400 text-brand-950 flex items-center justify-center shadow-lg shrink-0">
              <i data-lucide="graduation-cap" class="w-7 h-7"></i>
            </div>
            <div>
              <h1 id="ui-platform-title" class="text-xl font-black tracking-tight leading-tight">مساحة صفّي</h1>

        <!-- Navigation Links -->

          </button>

          <button data-nav="achievements" onclick="App.setMainTab('achievements')" class="nav-btn w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-extrabold text-base transition text-right">

        <div class="flex items-center justify-between mb-2">

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">

      <!-- Persistent Active Lesson & Traffic Light Bar -->

            <button onclick="App.autoDetectSchedule(true)" title="تحديد الحصة تلقائيًا حسب الجدول والوقت" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition">

          </div>

          <!-- Classroom Traffic Light & Floating Mini Timer -->
          <div class="flex items-center gap-3">
            <!-- Traffic Light Control -->
            <div class="flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-2xl shadow-inner" title="إشارة ضبط الصف">
              <span class="text-[11px] font-bold text-slate-300 ml-1 hidden sm:inline">إشارة الصف:</span>
              <button onclick="App.setTrafficLight('green')" id="tl-green" class="w-6 h-6 rounded-full bg-emerald-500/30 border border-emerald-400 transition" title="أخضر: نقاش وتفاعل حر"></button>
              <button onclick="App.setTrafficLight('yellow')" id="tl-yellow" class="w-6 h-6 rounded-full bg-amber-400/30 border border-amber-300 transition" title="أصفر: صوت منخفض / عمل مجموعات"></button>

      <!-- Dynamic Content Container -->

      </div>

  <!-- Firebase Modular SDK (Optional Cloud Sync when configured) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    window.FirebaseBridge = {
      available: false,
      app: null,
      auth: null,
      db: null,
      user: null,
      unsubscribe: null,

      init(customConfig) {
        try {
          let cfg = customConfig;
          if (!cfg && typeof __firebase_config !== 'undefined' && __firebase_config) {
            cfg = JSON.parse(__firebase_config);
          }
          if (!cfg || !cfg.apiKey) {
            this.available = false;
            return false;
          }
          this.app = initializeApp(cfg);
          this.auth = getAuth(this.app);
          this.db = getFirestore(this.app);
          this.available = true;

          onAuthStateChanged(this.auth, async (user) => {
            this.user = user;
            if (user) {
              window.App?.onCloudUserChanged(user);
              this.listenToUserDoc(user.uid);
            } else {
              if (this.unsubscribe) this.unsubscribe();
              window.App?.onCloudUserChanged(null);
            }
          });

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            signInWithCustomToken(this.auth, __initial_auth_token).catch(() => {});
          }
          return true;
        } catch (e) {
          console.error("Firebase init error:", e);
          this.available = false;
          return false;
        }
      },

      listenToUserDoc(uid) {
        if (!this.db) return;
        if (this.unsubscribe) this.unsubscribe();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'masahat-saffi';
        const ref = doc(this.db, 'artifacts', appId, 'users', uid, 'classroomData', 'mainState');
        this.unsubscribe = onSnapshot(ref, (snap) => {
          if (snap.exists()) {
            window.App?.applyRemoteState(snap.data());
          }
        }, (err) => {
          console.error("Firestore sync error:", err);
          window.App?.setSyncStatus('error', 'خطأ في المزامنة السحابية');
        });
      },

      async saveState(stateObj) {
        if (!this.available || !this.user || !this.db) return false;

    /* ==========================================================================
       1. SOUND ENGINE (Web Audio API - No external audio files needed)
       ========================================================================== */
    const SoundFX = {
      ctx: null,
      ensureCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      play(type) {
        if (!App.state.settings.soundEnabled) return;
        try {
          this.ensureCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'heart') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.16);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now); osc.stop(now + 0.26);
          } else if (type === 'tick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(640, now);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            osc.start(now); osc.stop(now + 0.05);
          } else if (type === 'win') {
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.connect(g); g.connect(this.ctx.destination);
              o.type = 'triangle';
              o.frequency.setValueAtTime(freq, now + idx * 0.09);
              g.gain.setValueAtTime(0.15, now + idx * 0.09);
              g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
              o.start(now + idx * 0.09); o.stop(now + idx * 0.09 + 0.36);
            });
          } else if (type === 'alarm') {
            [880, 660, 880, 660].forEach((freq, idx) => {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.connect(g); g.connect(this.ctx.destination);
              o.type = 'sine';
              o.frequency.setValueAtTime(freq, now + idx * 0.18);
              g.gain.setValueAtTime(0.2, now + idx * 0.18);
              g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.16);
              o.start(now + idx * 0.18); o.stop(now + idx * 0.18 + 0.17);
            });
          } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.25);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.start(now); osc.stop(now + 0.3);
          }
        } catch (e) {}
      }

    /* ==========================================================================

       ========================================================================== */
    const FileDB = {
      dbName: 'MasahatSaffiFilesDB',
      storeName: 'files',
      open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(this.storeName);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async saveFile(id, dataUrl) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.storeName, 'readwrite');
          tx.objectStore(this.storeName).put(dataUrl, id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      },
      async getFile(id) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.storeName, 'readonly');
          const req = tx.objectStore(this.storeName).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      },
      async deleteFile(id) {
        const db = await this.open();
        return new Promise((resolve) => {
          const tx = db.transaction(this.storeName, 'readwrite');
          tx.objectStore(this.storeName).delete(id);
          tx.oncomplete = () => resolve(true);

      updateClock() {
        try {
          const tz = this.state.settings.timezone || 'Asia/Riyadh';
          const now = new Date();
          const formatted = new Intl.DateTimeFormat('ar-SA', {
            timeZone: tz,
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            hour: '2-digit',
            minute: '2-digit'
          }).format(now);
          const el = document.getElementById('ui-date-clock');
          if (el) el.textContent = formatted;
        } catch (e) {}
      },

      getCurrentScheduleMatch() {
        try {
          const tz = this.state.settings.timezone || 'Asia/Riyadh';
          const now = new Date();
          const dayName = new Intl.DateTimeFormat('ar-SA', { timeZone: tz, weekday: 'long' }).format(now);
          const parts = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
          const [hh, mm] = parts.split(':').map(Number);
          const nowMin = hh * 60 + mm;

          const matchedDay = this.state.schedule.days.find(d => dayName.includes(d) || d.includes(dayName));
          if (!matchedDay) return null;

          for (const p of this.state.schedule.periods) {
            const [sh, sm] = p.start.split(':').map(Number);
            const [eh, em] = p.end.split(':').map(Number);
            const startMin = sh * 60 + sm;
            const endMin = eh * 60 + em;
            if (nowMin >= startMin && nowMin <= endMin) {
              const slot = this.state.schedule.slots[`${matchedDay}_${p.id}`];
              return { day: matchedDay, period: p, slot };
            }
          }
        } catch (e) {}
        return null;
      },

      autoDetectSchedule(notify = false) {
        const match = this.getCurrentScheduleMatch();
        const labelEl = document.getElementById('ui-period-label');
        if (match && match.slot && match.slot.classId) {
          this.activePeriodId = match.period.id;
          this.activeClassId = match.slot.classId;
          if (match.slot.subjectId) this.activeSubjectId = match.slot.subjectId;
          if (labelEl) labelEl.textContent = `${match.period.name} (${match.period.start})`;
          this.renderHeaderSelectors();
          if (notify) UI.toast(`تم الضبط تلقائيًا على ${match.period.name}`, 'success');
        } else {
          if (labelEl) labelEl.textContent = 'اختيار يدوي';
          if (notify) UI.toast('لا توجد حصة مجدولة في هذا الوقت حاليًا — يمكنك الاختيار يدويًا', 'info');

      /* ========================================================================
         HEART POINTS ENGINE (Strict Group Rule + Idempotency + Audit Trail)
         ======================================================================== */
      getClassStudents(classId = this.activeClassId) {
        return this.state.students.filter(s => s.classId === classId);
      },

      getStudentHearts(studentId, periodFilter = 'all') {
        const now = Date.now();
        const dayMs = 86400000;
        return this.state.heartLedger
          .filter(tx => tx.studentId === studentId)
          .filter(tx => {
            if (periodFilter === 'lesson') return tx.classId === this.activeClassId && (now - tx.timestamp) < 4 * 3600000;
            if (periodFilter === 'week') return (now - tx.timestamp) <= 7 * dayMs;
            if (periodFilter === 'month') return (now - tx.timestamp) <= 30 * dayMs;
            return true;
          })
          .reduce((sum, tx) => sum + Number(tx.delta || 0), 0);
      },

      getGroupHearts(group, periodFilter = 'all') {
        if (!group || !Array.isArray(group.studentIds)) return 0;
        return group.studentIds.reduce((sum, sid) => sum + this.getStudentHearts(sid, periodFilter), 0);
      },

      awardHearts({ studentIds, delta, reason, source, idempotencyKey = null }) {
        if (!studentIds || studentIds.length === 0) {
          UI.toast('لا يوجد طلاب محددون لمنح القلوب', 'warning');
          return false;
        }
        if (idempotencyKey && this.recentTxIds.has(idempotencyKey)) {
          return false; // Prevent duplicate click / double scan
        }
        if (idempotencyKey) {
          this.recentTxIds.add(idempotencyKey);
          setTimeout(() => this.recentTxIds.delete(idempotencyKey), 4000);
        }

        const txGroupId = UI.uid('txg');
        const now = Date.now();
        const val = Number(delta);

        // Rule: Each member receives the FULL delta (not divided)
        studentIds.forEach(sid => {
          const stu = this.state.students.find(s => s.id === sid);
          if (!stu) return;
          this.state.heartLedger.unshift({
            id: UI.uid('tx'),
            txGroupId,
            studentId: sid,
            classId: stu.classId,
            periodId: this.activePeriodId || 'manual',
            delta: val,
            reason: reason || 'مشاركة صفية',
            source: source || 'يدوي',
            timestamp: now
          });
        });

        this.saveState(true);
        if (val > 0) SoundFX.play('heart');
        return txGroupId;
      },

      undoTransactionGroup(txGroupId) {
        const entries = this.state.heartLedger.filter(t => t.txGroupId === txGroupId && !t.isReversal && !t.reversed);
        if (entries.length === 0) return;

        const revGroupId = UI.uid('rev');
        const now = Date.now();
        entries.forEach(orig => {
          orig.reversed = true;
          this.state.heartLedger.unshift({
            id: UI.uid('tx'),
            txGroupId: revGroupId,
            studentId: orig.studentId,
            classId: orig.classId,
            periodId: orig.periodId,
            delta: -orig.delta,
            reason: `تراجع عن: ${orig.reason}`,
            source: 'تراجع',
            timestamp: now,
            isReversal: true
          });
        });

        this.saveState();
        UI.toast('تم التراجع وتسجيل قيد عكسي في السجل', 'info');
        this.renderCurrentView();
      },

      downloadExcelTemplate() {
        const wsData = [
          ['اسم الطالب', 'ملاحظات (اختياري)'],
          ['أحمد محمد العتيبي', ''],
          ['سارة عبدالله القحطاني', ''],
          ['نورة فهد الدوسري', '']
        ];
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
        XLSX.writeFile(wb, 'نموذج_أسماء_الطلاب_مساحة_صفي.xlsx');
        UI.toast('تم تنزيل نموذج Excel بنجاح', 'success');
      },

      async handleStudentFileImport(event, classId) {
        const file = event.target.files[0];
        if (!file) return;
        event.target.value = '';
        let extractedNames = [];

        try {
          if (file.name.toLowerCase().endsWith('.pdf')) {
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              const lines = content.items.map(it => it.str.trim()).filter(s => s.length >= 3 && !/^\d+$/.test(s));
              extractedNames.push(...lines);
            }
          } else {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            rows.forEach((row, idx) => {
              const cell = String(row[0] || '').trim();
              if (!cell) return;
              if (idx === 0 && (cell.includes('اسم') || cell.toLowerCase().includes('name'))) return;
              extractedNames.push(cell);
            });
          }

          if (extractedNames.length === 0) {
            UI.toast('لم يتم العثور على أسماء صالحة في الملف', 'warning');
            return;
          }

          const existingNames = new Set(App.getClassStudents(classId).map(s => s.name));
          const seenInFile = new Set();
          const previewRows = extractedNames.map((name, i) => {
            const isDup = existingNames.has(name) || seenInFile.has(name);
            seenInFile.add(name);
            return { idx: i, name, isDup, include: !isDup };
          });

          window._importPreview = { classId, rows: previewRows };
          UI.openModal({
            title: `معاينة الاستيراد (${previewRows.length} اسم)`,
            bodyHtml: `
              <div class="space-y-3">
                <p class="text-xs text-slate-500">راجع الأسماء المستخرجة قبل الاعتماد. الأسماء المكررة مميزة باللون الأصفر.</p>
                <div class="max-h-72 overflow-y-auto border border-slate-200 rounded-2xl divide-y">
                  ${previewRows.map((r, idx) => `
                    <label class="flex items-center justify-between p-2.5 text-sm ${r.isDup ? 'bg-amber-50' : ''}">
                      <div class="flex items-center gap-2">
                        <input type="checkbox" ${r.include ? 'checked' : ''} onchange="window._importPreview.rows[${idx}].include = this.checked" class="w-4 h-4 accent-brand-700" />
                        <span class="font-bold text-slate-800">${UI.escapeHtml(r.name)}</span>
                      </div>
                      ${r.isDup ? '<span class="text-[11px] font-bold text-amber-700 bg-amber-200/60 px-2 py-0.5 rounded-full">اسم مكرر</span>' : '<span class="text-[11px] text-emerald-600 font-bold">جديد</span>'}
                    </label>
                  `).join('')}
                </div>
              </div>
            `,
            actions: [
              { label: 'إلغاء', className: 'px-4 py-2 rounded-xl bg-slate-100 font-bold' },
              {
                label: 'اعتماد وإضافة المحدد',
                onClick: () => {
                  const chosen = window._importPreview.rows.filter(r => r.include && r.name.trim());
                  chosen.forEach(r => {
                    App.state.students.push({
                      id: UI.uid('stu'),
                      classId: window._importPreview.classId,
                      name: r.name.trim(),
                      qrToken: UI.qrToken()
                    });
                  });
                  App.saveState();
                  App.renderCurrentView();
                  UI.toast(`تم استيراد ${chosen.length} طالب بنجاح`, 'success');
                }
              }
            ]
          });
        } catch (err) {
          console.error(err);
          UI.toast('تعذر قراءة الملف. تأكد من سلامة صيغة Excel أو PDF', 'error');
        }
      },

        const file = event.target.files[0];
        if (!file) return;
        event.target.value = '';
        const ext = file.name.split('.').pop().toLowerCase();
        let type = 'pdf';
        if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) type = 'image';
        else if (ext === 'docx') type = 'docx';
        else if (ext === 'pptx') type = 'pptx';

        const id = UI.uid('book');
        UI.toast('جاري معالجة وحفظ الملف...', 'info');

        try {
          const reader = new FileReader();
          const dataUrl = await new Promise((res, rej) => {
            reader.onload = () => res(reader.result);
            reader.onerror = rej;
            reader.readAsDataURL(file);
          });

          await FileDB.saveFile(id, dataUrl);

          let docxHtml = null;
          let pptxSlides = null;

          if (type === 'docx' && window.mammoth) {
            const arrBuf = await file.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer: arrBuf });
            docxHtml = result.value || '<p>تم استخراج المستند.</p>';
          } else if (type === 'pptx' && window.JSZip) {
            const arrBuf = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(arrBuf);
            const slideFiles = Object.keys(zip.files)
              .filter(k => k.startsWith('ppt/slides/slide') && k.endsWith('.xml'))
              .sort((a, b) => {
                const na = parseInt(a.match(/\d+/)?.[0] || '0');
                const nb = parseInt(b.match(/\d+/)?.[0] || '0');
                return na - nb;
              });
            pptxSlides = [];
            for (const sf of slideFiles) {
              const xml = await zip.files[sf].async('text');
              const matches = [...xml.matchAll(/<a:t[^>]*>([^<]+)<\/a:t>/g)].map(m => m[1]);
              pptxSlides.push(matches.join(' ') || '(شريحة بدون نص)');
            }
          }

          App.state.books.unshift({
            id,
            title: file.name,
            type,
            subjectId: App.activeSubjectId,
            classIds: App.activeClassId ? [App.activeClassId] : [],
            createdAt: Date.now(),
            lastPageByClass: {},
            docxHtml,
            pptxSlides
          });
          App.saveState();
          App.renderCurrentView();
          UI.toast('تم رفع الملف بنجاح!', 'success');
        } catch (e) {
          console.error(e);
          UI.toast('حدث خطأ أثناء رفع الملف', 'error');
        }
      },

        const book = App.state.books.find(b => b.id === id);

        const dataUrl = await FileDB.getFile(id);
        if (!dataUrl) return UI.toast('الملف غير متوفر في التخزين المحلي لهذا المتصفح', 'warning');
        const a = document.createElement('a');

        a.click();

            <div class="w-full lg:w-[360px] shrink-0 flex flex-col h-auto lg:sticky lg:top-24 z-10 bg-slate-100/50 rounded-3xl border border-slate-200 shadow-inner overflow-hidden">
              <div class="flex flex-wrap gap-1 bg-white p-2 border-b border-slate-200 shadow-sm">

                  <button onclick="App.lessonMainTab='${t.id}'; App.renderCurrentView()"
                    class="px-5 py-2.5 rounded-xl font-extrabold text-sm flex items-center gap-2 transition ${App.lessonMainTab === t.id ? 'bg-amber-400 text-brand-950 shadow' : 'text-slate-600 hover:bg-slate-100'}">

        else if (App.lessonSideTab === 'points') QRScannerModule.render(sideArea);
      },

      openBookInViewer(bookId) {
        App.viewerState.bookId = bookId;
        const book = App.state.books.find(b => b.id === bookId);
        if (book && book.lastPageByClass && book.lastPageByClass[App.activeClassId]) {

        } else {
          App.viewerState.pageNum = 1;
        }
        App.mainTab = 'lesson';
        App.lessonMainTab = 'viewer';
        App.setMainTab('lesson');
      }
    };

    /* --- 6.1 Book & Presentation Viewer with Normalized Canvas Annotations --- */
    const BookViewerModule = {
      _isDrawing: false,
      _currentStroke: null,

      render(el) {
        const books = App.state.books;
        if (books.length === 0) {
          el.innerHTML = `
            <div class="bg-white p-10 rounded-3xl border border-slate-200 text-center space-y-3">
              <p class="font-extrabold text-slate-700 text-lg">لا توجد كتب أو عروض مرفوعة بعد</p>
              <button onclick="App.mainTab='prep'; App.prepSubTab='books'; App.setMainTab('prep')" class="px-5 py-2.5 rounded-xl bg-brand-700 text-white font-bold">
                الانتقال لرفع كتاب PDF أو عرض
              </button>
            </div>
          `;
          return;
        }

        if (!App.viewerState.bookId || !books.some(b => b.id === App.viewerState.bookId)) {
          App.viewerState.bookId = books[0].id;
        }
        const book = books.find(b => b.id === App.viewerState.bookId);

        el.innerHTML = `
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <!-- Toolbar -->
            <div class="p-3 bg-slate-900 text-white flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <select onchange="LessonView.openBookInViewer(this.value)" class="bg-slate-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 max-w-[200px]">
                  ${books.map(b => `<option value="${b.id}" ${b.id === book.id ? 'selected' : ''}>${UI.escapeHtml(b.title)}</option>`).join('')}
                </select>
                ${book.type === 'pdf' || book.type === 'pptx' ? `
                  <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-xl">
                    <button onclick="BookViewerModule.changePage(-1)" class="p-1 hover:bg-slate-700 rounded"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    <span id="bv-page-info" class="text-xs font-bold px-2">صفحة ${App.viewerState.pageNum}</span>
                    <button onclick="BookViewerModule.changePage(1)" class="p-1 hover:bg-slate-700 rounded"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                  </div>
                ` : ''}
                ${book.type === 'pdf' ? `
                  <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-xl">
                    <button onclick="BookViewerModule.zoom(-0.2)" class="px-2 py-0.5 text-xs font-black hover:bg-slate-700 rounded">-</button>
                    <span class="text-xs font-mono">${Math.round(App.viewerState.scale * 100)}%</span>
                    <button onclick="BookViewerModule.zoom(0.2)" class="px-2 py-0.5 text-xs font-black hover:bg-slate-700 rounded">+</button>
                  </div>
                ` : ''}
              </div>

              <!-- Annotation Tools -->
              <div class="flex flex-wrap items-center gap-1.5">
                <button onclick="App.viewerState.tool='pen'; App.renderCurrentView()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${App.viewerState.tool === 'pen' ? 'bg-amber-400 text-brand-950' : 'bg-slate-800'}">✏️ قلم</button>
                <button onclick="App.viewerState.tool='highlighter'; App.renderCurrentView()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${App.viewerState.tool === 'highlighter' ? 'bg-amber-400 text-brand-950' : 'bg-slate-800'}">🖍️ تظليل</button>
                <button onclick="App.viewerState.tool='eraser'; App.renderCurrentView()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${App.viewerState.tool === 'eraser' ? 'bg-amber-400 text-brand-950' : 'bg-slate-800'}">🧹 ممحاة</button>
                <input type="color" value="${App.viewerState.color}" onchange="App.viewerState.color=this.value" class="w-7 h-7 rounded cursor-pointer bg-transparent" />
                <select onchange="App.viewerState.lineWidth=parseInt(this.value)" class="bg-slate-800 text-white text-xs px-2 py-1.5 rounded-xl">
                  <option value="3" ${App.viewerState.lineWidth === 3 ? 'selected' : ''}>رفيع</option>
                  <option value="6" ${App.viewerState.lineWidth === 6 ? 'selected' : ''}>متوسط</option>
                  <option value="14" ${App.viewerState.lineWidth === 14 ? 'selected' : ''}>عريض</option>
                </select>
                <button onclick="BookViewerModule.undo()" title="تراجع" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
                <button onclick="BookViewerModule.redo()" title="إعادة" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
                <button onclick="App.viewerState.showAnnotations=!App.viewerState.showAnnotations; BookViewerModule.redrawAnnotations()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-xs font-bold">
                  ${App.viewerState.showAnnotations ? '👁️ إخفاء' : '👁️ إظهار'}
                </button>
                <button onclick="BookViewerModule.clearPageAnnotations()" class="px-2.5 py-1.5 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-xs font-bold">مسح الصفحة</button>
              </div>
            </div>

            <!-- Viewport -->
            <div id="bv-stage" class="relative overflow-auto bg-slate-200 min-h-[62vh] max-h-[75vh] flex justify-center items-start p-4">
              <div id="bv-canvas-wrap" class="relative inline-block shadow-2xl bg-white">
                <canvas id="bv-pdf-canvas" class="block"></canvas>
                <img id="bv-img-el" class="hidden max-w-full h-auto block" />
                <div id="bv-doc-el" class="hidden p-8 max-w-3xl text-right leading-loose text-slate-900"></div>
                <canvas id="bv-draw-canvas" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
              </div>
            </div>
          </div>
        `;

        setTimeout(() => this.loadDocument(book), 30);
      },

      async loadDocument(book) {
        const pdfCanvas = document.getElementById('bv-pdf-canvas');
        const imgEl = document.getElementById('bv-img-el');
        const docEl = document.getElementById('bv-doc-el');
        const drawCanvas = document.getElementById('bv-draw-canvas');
        if (!pdfCanvas || !drawCanvas) return;

        pdfCanvas.classList.add('hidden');
        imgEl.classList.add('hidden');
        docEl.classList.add('hidden');

        if (book.type === 'pdf') {
          const dataUrl = await FileDB.getFile(book.id);
          if (!dataUrl) {
            docEl.classList.remove('hidden');
            docEl.innerHTML = `<p class="text-rose-600 font-bold">يرجى إعادة رفع ملف PDF على هذا الجهاز لعرضه.</p>`;
            return;
          }
          pdfCanvas.classList.remove('hidden');
          const pdf = await pdfjsLib.getDocument(dataUrl).promise;
          App.viewerState.numPages = pdf.numPages;
          if (App.viewerState.pageNum > pdf.numPages) App.viewerState.pageNum = 1;
          const pageInfo = document.getElementById('bv-page-info');
          if (pageInfo) pageInfo.textContent = `صفحة ${App.viewerState.pageNum} / ${pdf.numPages}`;

          const page = await pdf.getPage(App.viewerState.pageNum);
          const viewport = page.getViewport({ scale: App.viewerState.scale });
          pdfCanvas.width = viewport.width;
          pdfCanvas.height = viewport.height;
          drawCanvas.width = viewport.width;
          drawCanvas.height = viewport.height;

          await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport }).promise;
        } else if (book.type === 'image') {
          const dataUrl = await FileDB.getFile(book.id);
          imgEl.classList.remove('hidden');
          imgEl.src = dataUrl || '';
          imgEl.onload = () => {
            drawCanvas.width = imgEl.clientWidth || 800;
            drawCanvas.height = imgEl.clientHeight || 600;
            this.redrawAnnotations();
          };
        } else if (book.type === 'docx') {
          docEl.classList.remove('hidden');
          docEl.innerHTML = book.docxHtml || '<p>لا يوجد محتوى نصي مستخرج.</p>';
          drawCanvas.width = docEl.clientWidth || 750;
          drawCanvas.height = Math.max(docEl.clientHeight, 500);
        } else if (book.type === 'pptx') {
          docEl.classList.remove('hidden');
          const slides = book.pptxSlides || ['شريحة فارغة'];
          App.viewerState.numPages = slides.length;
          if (App.viewerState.pageNum > slides.length) App.viewerState.pageNum = 1;
          const pageInfo = document.getElementById('bv-page-info');
          if (pageInfo) pageInfo.textContent = `شريحة ${App.viewerState.pageNum} / ${slides.length}`;
          docEl.innerHTML = `
            <div class="p-8 bg-gradient-to-br from-brand-50 to-amber-50 rounded-2xl border border-brand-200 min-h-[420px] flex flex-col justify-center">
              <div class="text-xs font-extrabold text-brand-600 mb-3">شريحة ${App.viewerState.pageNum} من ${slides.length}</div>
              <div class="text-2xl font-black text-slate-900 leading-relaxed">${UI.escapeHtml(slides[App.viewerState.pageNum - 1])}</div>
            </div>
          `;
          drawCanvas.width = docEl.clientWidth || 750;
          drawCanvas.height = Math.max(docEl.clientHeight, 450);
        }

        this.bindDrawingEvents(drawCanvas);
        this.redrawAnnotations();
      },

      getAnnotKey() {
        return `${App.viewerState.bookId}_${App.activeClassId || 'default'}_${App.viewerState.pageNum}`;
      },

      bindDrawingEvents(canvas) {
        const getNormPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          return {
            x: (e.clientX - rect.left) / rect.width,
            y: (e.clientY - rect.top) / rect.height
          };
        };

        canvas.onpointerdown = (e) => {
          canvas.setPointerCapture(e.pointerId);
          this._isDrawing = true;
          const pos = getNormPos(e);
          if (App.viewerState.tool === 'eraser') {
            this.eraseAt(pos);
            return;
          }
          this._currentStroke = {
            tool: App.viewerState.tool,
            color: App.viewerState.color,
            width: App.viewerState.lineWidth,
            points: [pos]
          };
        };

        canvas.onpointermove = (e) => {
          if (!this._isDrawing) return;
          const pos = getNormPos(e);
          if (App.viewerState.tool === 'eraser') {
            this.eraseAt(pos);
            return;
          }
          if (this._currentStroke) {
            this._currentStroke.points.push(pos);
            this.redrawAnnotations(this._currentStroke);
          }
        };

        canvas.onpointerup = () => {
          if (!this._isDrawing) return;
          this._isDrawing = false;
          if (this._currentStroke && this._currentStroke.points.length > 0) {
            const key = this.getAnnotKey();
            if (!App.state.annotations[key]) App.state.annotations[key] = [];
            App.state.annotations[key].push(this._currentStroke);
            this._currentStroke = null;
            App.saveState(true);
            this.redrawAnnotations();
          }
        };
      },

      eraseAt(pos) {
        const key = this.getAnnotKey();
        const list = App.state.annotations[key] || [];
        const filtered = list.filter(stroke =>
          !stroke.points.some(pt => Math.hypot(pt.x - pos.x, pt.y - pos.y) < 0.03)
        );
        if (filtered.length !== list.length) {
          App.state.annotations[key] = filtered;
          App.saveState(true);
          this.redrawAnnotations();
        }
      },

      redrawAnnotations(tempStroke = null) {
        const canvas = document.getElementById('bv-draw-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!App.viewerState.showAnnotations) return;

        const key = this.getAnnotKey();
        const strokes = [...(App.state.annotations[key] || [])];
        if (tempStroke) strokes.push(tempStroke);

        strokes.forEach(s => {
          if (!s.points || s.points.length === 0) return;
          ctx.save();
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.tool === 'highlighter' ? s.width * 3 : s.width;
          ctx.globalAlpha = s.tool === 'highlighter' ? 0.35 : 1.0;

          ctx.moveTo(s.points[0].x * canvas.width, s.points[0].y * canvas.height);
          for (let i = 1; i < s.points.length; i++) {
            ctx.lineTo(s.points[i].x * canvas.width, s.points[i].y * canvas.height);
          }
          ctx.stroke();
          ctx.restore();
        });
      },

      changePage(delta) {
        const next = App.viewerState.pageNum + delta;
        if (next < 1 || next > App.viewerState.numPages) return;
        App.viewerState.pageNum = next;
        const book = App.state.books.find(b => b.id === App.viewerState.bookId);
        if (book && App.activeClassId) {
          if (!book.lastPageByClass) book.lastPageByClass = {};
          book.lastPageByClass[App.activeClassId] = next;
          App.saveState(true);
        }
        App.renderCurrentView();
      },

      zoom(delta) {
        App.viewerState.scale = Math.min(2.5, Math.max(0.6, App.viewerState.scale + delta));
        App.renderCurrentView();
      },

      undo() {
        const key = this.getAnnotKey();
        const list = App.state.annotations[key];
        if (!list || list.length === 0) return;
        if (!App.viewerState.redoStack[key]) App.viewerState.redoStack[key] = [];
        App.viewerState.redoStack[key].push(list.pop());
        App.saveState(true);
        this.redrawAnnotations();
      },

      redo() {
        const key = this.getAnnotKey();
        const rList = App.viewerState.redoStack[key];
        if (!rList || rList.length === 0) return;
        if (!App.state.annotations[key]) App.state.annotations[key] = [];
        App.state.annotations[key].push(rList.pop());
        App.saveState(true);
        this.redrawAnnotations();
      },

      clearPageAnnotations() {
        UI.confirm('مسح تعليقات الصفحة', 'هل تريد مسح جميع الرسومات والتعليقات في هذه الصفحة؟', () => {
          const key = this.getAnnotKey();
          App.state.annotations[key] = [];
          App.saveState(true);
          this.redrawAnnotations();
        });
      }
    };

    /* --- 6.2 Wheel of Names (عجلة الأسماء العادلة) --- */
    const WheelModule = {
      _angle: 0,
      _spinning: false,

      ensureClassWheel(classId) {
        const students = App.getClassStudents(classId);
        const ids = students.map(s => s.id);
        let ws = App.state.wheelState[classId];
        if (!ws) {
          ws = { remainingIds: [...ids], pickedIds: [], lastWinnerId: null };
          App.state.wheelState[classId] = ws;
        } else {
          // Sync with current class roster
          ws.remainingIds = ws.remainingIds.filter(id => ids.includes(id));
          ws.pickedIds = ws.pickedIds.filter(id => ids.includes(id));
          if (ws.remainingIds.length === 0 && ws.pickedIds.length === 0 && ids.length > 0) {
            ws.remainingIds = [...ids];
          }
        }
        return ws;
      },

      render(el) {
        const classId = App.activeClassId;
        const students = App.getClassStudents(classId);
        if (!classId || students.length === 0) {
          el.innerHTML = `<div class="bg-white p-10 rounded-3xl border border-slate-200 text-center font-bold text-slate-500">اختر فصلًا يحتوي على طلاب لتشغيل عجلة الأسماء.</div>`;
          return;
        }

        const ws = this.ensureClassWheel(classId);
        const remainingStudents = ws.remainingIds.map(id => students.find(s => s.id === id)).filter(Boolean);
        const pickedStudents = ws.pickedIds.map(id => students.find(s => s.id === id)).filter(Boolean);

        el.innerHTML = `
          <div class="flex flex-col gap-4 p-4">
            <!-- Wheel Canvas Column -->
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-col items-center">
              <div class="relative w-full max-w-[260px] aspect-square flex items-center justify-center my-2">
                <!-- Pointer Arrow on Right -->
                <div class="absolute -left-2 top-1/2 -translate-y-1/2 z-10 w-0 h-0 border-t-[12px] border-t-transparent border-b-[12px] border-b-transparent border-r-[20px] border-r-amber-500 drop-shadow"></div>
                <canvas id="wheel-canvas" width="260" height="260" class="w-full h-full"></canvas>
                <button onclick="WheelModule.spin()" ${this._spinning || remainingStudents.length === 0 ? 'disabled' : ''}
                  class="absolute w-16 h-16 rounded-full bg-brand-900 text-amber-400 border-4 border-white font-black text-sm shadow-xl hover:scale-105 active:scale-95 transition disabled:opacity-50">
                  أدِر
                </button>
              </div>

              ${remainingStudents.length === 0 ? `
                <div class="mt-3 p-3 rounded-2xl bg-amber-50 border border-amber-300 text-center space-y-2 w-full">
                  <div class="font-extrabold text-amber-950 text-xs">🎉 أخذ الجميع فرصتهم!</div>
                  <button onclick="WheelModule.resetWheel()" class="px-4 py-1.5 rounded-xl bg-brand-700 text-white font-bold text-xs">بدء دورة جديدة</button>
                </div>
              ` : `
                <div class="mt-3 flex gap-2 w-full">
                  <button onclick="WheelModule.spin()" class="flex-1 py-2.5 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-black text-sm shadow-lg shadow-brand-200 transition">
                    🎡 اختيار
                  </button>
                  <button onclick="WheelModule.resetWheel()" class="px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
                    إعادة
                  </button>
                </div>
              `}
            </div>

            <!-- Remaining vs Picked Lists -->
            <div class="space-y-4">
              <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <h3 class="font-extrabold text-slate-900 text-xs">المتبقون (${remainingStudents.length})</h3>
                </div>
                <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto">
                  ${remainingStudents.map(s => `<span class="px-2 py-1 rounded-lg bg-brand-50 text-brand-900 font-bold text-[10px] sm:text-xs">${UI.escapeHtml(s.name)}</span>`).join('')}
                </div>
              </div>

              <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <h3 class="font-extrabold text-slate-700 text-xs">تم اختيارهم (${pickedStudents.length})</h3>
                </div>
                <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto">
                  ${pickedStudents.length === 0 ? `<span class="text-[10px] sm:text-xs text-slate-400">لم يتم اختيار أحد.</span>` :
                    pickedStudents.map(s => `<span class="px-2 py-1 rounded-lg bg-slate-100 text-slate-500 line-through font-bold text-[10px] sm:text-xs">${UI.escapeHtml(s.name)}</span>`).join('')}
                </div>
              </div>
            </div>
          </div>
        `;

        this.drawWheel(remainingStudents);
      },

      drawWheel(students) {
        const canvas = document.getElementById('wheel-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = cx - 10;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const list = students.length > 0 ? students : [{ name: 'انتهت الدورة' }];
        const palette = ['#7c3aed', '#f59e0b', '#0ea5e9', '#10b981', '#ec4899', '#6366f1', '#f97316', '#14b8a6'];
        const slice = (2 * Math.PI) / list.length;

        list.forEach((stu, i) => {
          const start = this._angle + i * slice;
          const end = start + slice;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, start, end);
          ctx.closePath();
          ctx.fillStyle = palette[i % palette.length];
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          // Label
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(start + slice / 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px Cairo, sans-serif';
          const shortName = stu.name.split(' ').slice(0, 2).join(' ');
          ctx.fillText(shortName, r - 18, 5);
          ctx.restore();
        });
      },

      spin() {
        if (this._spinning) return;
        const ws = this.ensureClassWheel(App.activeClassId);
        const students = App.getClassStudents(App.activeClassId);
        const remaining = ws.remainingIds.map(id => students.find(s => s.id === id)).filter(Boolean);
        if (remaining.length === 0) return;

        this._spinning = true;
        const duration = App.state.settings.reduceMotion ? 300 : 3200;
        const extraSpins = (5 + Math.random() * 4) * 2 * Math.PI;
        const startAngle = this._angle;
        const targetAngle = startAngle + extraSpins;
        const startTime = performance.now();
        let lastTickSlice = -1;

        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          this._angle = startAngle + (targetAngle - startAngle) * ease;
          this.drawWheel(remaining);

          const slice = (2 * Math.PI) / remaining.length;
          const curSlice = Math.floor(((this._angle % (2 * Math.PI)) + 2 * Math.PI) / slice);
          if (curSlice !== lastTickSlice) {
            lastTickSlice = curSlice;
            SoundFX.play('tick');
          }

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            this._spinning = false;
            // Pointer is at angle PI (left side)
            const norm = ((Math.PI - (this._angle % (2 * Math.PI))) + 4 * Math.PI) % (2 * Math.PI);
            const winIdx = Math.floor(norm / slice) % remaining.length;
            const winner = remaining[winIdx];

            ws.remainingIds = ws.remainingIds.filter(id => id !== winner.id);
            ws.pickedIds.push(winner.id);
            ws.lastWinnerId = winner.id;
            App.saveState(true);
            SoundFX.play('win');
            if (!App.state.settings.reduceMotion && window.confetti) {
              confetti({ particleCount: 55, spread: 60, origin: { y: 0.6 } });
            }

            UI.openModal({
              title: '🌟 الطالب المختار',
              bodyHtml: `
                <div class="text-center py-4 space-y-3">
                  <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-amber-100 text-4xl shadow-inner">🎓</div>
                  <div class="text-3xl font-black text-brand-900">${UI.escapeHtml(winner.name)}</div>
                  <p class="text-sm text-slate-500">تم استبعاده مؤقتًا من العجلة حتى يأخذ الجميع فرصتهم</p>
                  <div class="pt-3 flex justify-center gap-2">
                    <button onclick="App.awardHearts({ studentIds:['${winner.id}'], delta:5, reason:'مشاركة عبر العجلة', source:'العجلة' }); UI.toast('تم منح 5 قلوب ❤️ لـ ${UI.escapeHtml(winner.name)}', 'success'); UI.closeModal(); App.renderCurrentView();"
                      class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm">
                      + 5 قلوب ❤️
                    </button>
                    <button onclick="App.awardHearts({ studentIds:['${winner.id}'], delta:10, reason:'إجابة متميزة عبر العجلة', source:'العجلة' }); UI.toast('تم منح 10 قلوب ❤️ لـ ${UI.escapeHtml(winner.name)}', 'success'); UI.closeModal(); App.renderCurrentView();"
                      class="px-5 py-2.5 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-extrabold text-sm">
                      + 10 قلوب ❤️
                    </button>
                  </div>
                </div>
              `,
              actions: [{ label: 'متابعة', className: 'px-5 py-2 rounded-xl bg-slate-100 font-bold', onClick: () => App.renderCurrentView() }]
            });
          }
        };
        requestAnimationFrame(step);
      },

      resetWheel() {
        const students = App.getClassStudents(App.activeClassId);
        App.state.wheelState[App.activeClassId] = {
          remainingIds: students.map(s => s.id),
          pickedIds: [],
          lastWinnerId: null
        };
        App.saveState(true);
        App.renderCurrentView();
        UI.toast('تمت إعادة جميع أسماء الفصل للعجلة', 'info');
      }
    };

    /* --- 6.3 Lesson Timer (Persists in Header Mini-Badge across tabs) --- */
    const TimerModule = {
      format(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      updateDisplays() {
        const txt = this.format(App.timer.remainingSec);
        const mini = document.getElementById('mini-timer-display');
        const big = document.getElementById('big-timer-display');
        if (mini) mini.textContent = txt;
        if (big) big.textContent = txt;
      },

      setDuration(minutes) {
        this.pause();
        App.timer.totalSec = Math.max(10, Math.round(minutes * 60));
        App.timer.remainingSec = App.timer.totalSec;
        this.updateDisplays();
      },

      start() {
        if (App.timer.running) return;
        if (App.timer.remainingSec <= 0) App.timer.remainingSec = App.timer.totalSec;
        App.timer.running = true;
        App.timer.interval = setInterval(() => {
          if (App.timer.remainingSec > 0) {
            App.timer.remainingSec--;
            this.updateDisplays();
          } else {
            this.pause();
            SoundFX.play('alarm');
            UI.toast('⏰ انتهى وقت المؤقت!', 'warning');
          }
        }, 1000);
        if (App.mainTab === 'lesson' && App.lessonSubTab === 'timer') App.renderCurrentView();
      },

      pause() {
        App.timer.running = false;
        if (App.timer.interval) clearInterval(App.timer.interval);
        App.timer.interval = null;
        if (App.mainTab === 'lesson' && App.lessonSubTab === 'timer') App.renderCurrentView();
      },

      reset() {
        this.pause();
        App.timer.remainingSec = App.timer.totalSec;
        this.updateDisplays();
      },

      render(el) {
        el.innerHTML = `
          <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm text-center space-y-5 m-4">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-50 text-brand-700 text-[10px] font-extrabold">
              <i data-lucide="timer" class="w-3 h-3"></i>
              <span>يظهر في الشريط العلوي</span>
            </div>

            <div id="big-timer-display" class="text-5xl font-mono font-black text-slate-900 tracking-wider py-2">
              ${this.format(App.timer.remainingSec)}
            </div>

            <!-- Presets -->
            <div class="flex flex-wrap justify-center gap-1.5">
              ${[1, 2, 3, 5, 10, 15].map(m => `
                <button onclick="TimerModule.setDuration(${m})" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-brand-100 hover:text-brand-800 font-extrabold text-xs transition">
                  ${m} د
                </button>
              `).join('')}
            </div>

            <!-- Custom Minutes -->
            <div class="flex items-center justify-center gap-2">
              <input id="custom-timer-min" type="number" min="1" max="120" placeholder="دقائق" class="w-20 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-center" />
              <button onclick="const v=parseFloat(document.getElementById('custom-timer-min').value); if(v>0) TimerModule.setDuration(v);" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white font-bold text-xs">ضبط</button>
            </div>

            <!-- Controls -->
            <div class="flex flex-col gap-2 pt-2">
              ${!App.timer.running ? `
                <button onclick="TimerModule.start()" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow flex items-center justify-center gap-2">
                  <i data-lucide="play" class="w-4 h-4"></i> تشغيل
                </button>
              ` : `
                <button onclick="TimerModule.pause()" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-brand-950 font-black text-sm shadow flex items-center justify-center gap-2">
                  <i data-lucide="pause" class="w-4 h-4"></i> إيقاف
                </button>
              `}
              <button onclick="TimerModule.reset()" class="w-full py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold text-xs">
                إعادة ضبط
              </button>
            </div>
          </div>
        `;
      }
    };

                      <span class="px-2 py-0.5 rounded-md bg-rose-50 text-rose-600 font-black text-[10px]">

                            onclick="event.stopPropagation(); GroupsModule.selectForTapMove('${m.id}')"
                            class="px-2.5 py-1.5 rounded-lg border text-[11px] font-extrabold flex items-center justify-between cursor-pointer transition ${this._selectedStudentForMove === m.id ? 'bg-brand-700 text-white border-brand-700' : 'bg-slate-50 border-slate-200 text-slate-800 hover:bg-brand-50'}">
                            <span class="truncate pr-1">${UI.escapeHtml(m.name)}</span>
                            <span class="shrink-0 ${this._selectedStudentForMove === m.id ? 'text-amber-300' : 'text-rose-600'}">${App.getStudentHearts(m.id)} ❤️</span>
                          </div>
                        `).join('')}
                    </div>

                    <!-- Award Hearts -->
                    <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-1">
                      <span class="text-[9px] font-bold text-slate-500">منح الكل:</span>
                      <div class="flex gap-1">
                        ${[5, 10, 15].map(pts => `
                          <button onclick="event.stopPropagation(); GroupsModule.awardGroup('${g.id}', ${pts})"
                            class="px-2 py-1 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-[10px] shadow-sm transition">
                            +${pts}
                          </button>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      generateRandom() {
        const classId = App.activeClassId;
        const students = [...App.getClassStudents(classId)];
        const count = Math.min(12, Math.max(2, parseInt(document.getElementById('grp-count-inp').value) || 4));
        // Fisher-Yates shuffle
        for (let i = students.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [students[i], students[j]] = [students[j], students[i]];
        }
        const groups = Array.from({ length: count }, (_, i) => ({
          id: UI.uid('grp'),
          name: `المجموعة ${i + 1}`,
          studentIds: []
        }));
        students.forEach((stu, idx) => {
          groups[idx % count].studentIds.push(stu.id);
        });
        App.state.groupsByClass[classId] = groups;
        this._selectedStudentForMove = null;
        App.saveState();
        App.renderCurrentView();
        UI.toast('تم توزيع الطلاب عشوائيًا بشكل متوازن', 'success');
      },

      createEmptyGroups() {

        const count = Math.min(12, Math.max(2, parseInt(document.getElementById('grp-count-inp').value) || 4));
        App.state.groupsByClass[classId] = Array.from({ length: count }, (_, i) => ({
          id: UI.uid('grp'),
          name: `المجموعة ${i + 1}`,
          studentIds: []
        }));
        App.saveState();
        App.renderCurrentView();

        if (g && newName.trim()) {
          g.name = newName.trim();
          App.saveState(true);
        }

        groups.forEach(g => {
          g.studentIds = g.studentIds.filter(id => id !== studentId);

        const target = groups.find(g => g.id === targetGroupId);
        if (target) target.studentIds.push(studentId);
        this._selectedStudentForMove = null;
        App.saveState(true);
        App.renderCurrentView();

    /* --- 6.5 2D Educational Games (Wordwall-style: Open the Box, Quiz Show, 2D Rocket Race) --- */

              ].map(g => `

              `).join('')}
            </div>

            <!-- Setup Panel -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-5">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">نظام المشاركة</label>
                  <select id="gm-mode" class="w-full p-3 rounded-xl border border-slate-200 font-bold text-sm bg-white">
                    <option value="groups">المجموعات المحفوظة للفصل</option>
                    <option value="students">طلاب الفصل (فردي)</option>
                  </select>
                </div>
                <div>

              <!-- Quick Add Question Before Game -->
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
