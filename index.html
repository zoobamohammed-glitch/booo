        else this._selectedQIds.add(id);
        App.renderCurrentView();
      },

      selectAllQs() {
        App.state.questions.forEach(q => this._selectedQIds.add(q.id));
        App.renderCurrentView();
      },

      addQuickQuestion() {
        const text = document.getElementById('gm-quick-q').value.trim();
        const a1 = document.getElementById('gm-quick-ans1').value.trim();
        const a2 = document.getElementById('gm-quick-ans2').value.trim();
        if (!text || !a1 || !a2) return UI.toast('أدخل السؤال والإجابة الصحيحة وخيارًا آخر', 'warning');

        const opts = [a1, a2].sort(() => Math.random() - 0.5);
        const q = {
          id: UI.uid('q'),
          type: 'mcq',
          text,
          options: opts,
          correctIndex: opts.indexOf(a1),
          subjectId: App.activeSubjectId,
          unit: 'سؤال سريع',
          points: 10,
          timerSec: 20
        };
        App.state.questions.unshift(q);
        this._selectedQIds.add(q.id);
        App.saveState(true);
        App.renderCurrentView();
        UI.toast('تمت إضافة السؤال وحفظه في البنك', 'success');
      },

      startGame() {
        const mode = document.getElementById('gm-mode').value;
        const order = document.getElementById('gm-order').value;
        const pts = parseInt(document.getElementById('gm-pts').value) || 10;

        let chosenQs = App.state.questions.filter(q => this._selectedQIds.has(q.id));
        if (chosenQs.length === 0) return UI.toast('اختر سؤالًا واحدًا على الأقل للبدء', 'warning');
        if (order === 'random') chosenQs = [...chosenQs].sort(() => Math.random() - 0.5);

        let participants = [];
        if (mode === 'groups') {
          const groups = App.state.groupsByClass[App.activeClassId] || [];
          if (groups.length === 0) return UI.toast('يرجى تكوين مجموعات للفصل أولاً أو اختيار اللعب الفردي', 'warning');
          participants = groups.map(g => ({ id: g.id, name: g.name, studentIds: g.studentIds, score: 0, steps: 0 }));
        } else {
          const students = App.getClassStudents(App.activeClassId);
          if (students.length === 0) return UI.toast('لا يوجد طلاب في الفصل الحالي', 'warning');
          participants = students.slice(0, 8).map(s => ({ id: s.id, name: s.name, studentIds: [s.id], score: 0, steps: 0 }));
        }

        App.gameState = {
          active: true,
          gameType: App.gameState.gameType,
          mode,
          participants,
          turnIndex: 0,
          questions: chosenQs,
          qIndex: 0,
          openedBoxes: [],
          currentQuestion: App.gameState.gameType === 'box' ? null : chosenQs[0],
          selectedOption: null,
          revealed: false,
          pointsPerQ: pts
        };
        App.renderCurrentView();
      },

      renderActiveGame(el) {
        const gs = App.gameState;
        const currentTurn = gs.participants[gs.turnIndex % gs.participants.length];

        el.innerHTML = `
          <div class="bg-slate-950 text-white p-5 md:p-7 rounded-3xl shadow-2xl space-y-6">
            <!-- Top Game HUD -->
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 pb-4">
              <div class="flex items-center gap-3">
                <span class="px-3.5 py-1.5 rounded-xl bg-amber-400 text-brand-950 font-black text-sm">
                  الدور الآن: ${UI.escapeHtml(currentTurn.name)}
                </span>
                <span class="text-xs text-slate-300 font-bold">قيمة السؤال: ${gs.pointsPerQ} ❤️</span>
              </div>
              <button onclick="App.gameState.active=false; App.renderCurrentView()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs">
                إنهاء اللعبة
              </button>
            </div>

            <!-- Participants Score Strip / 2D Rocket Race Track -->
            ${gs.gameType === 'race' ? `
              <div class="bg-slate-900 p-4 rounded-2xl border border-white/10 space-y-3">
                <div class="text-xs font-bold text-amber-300">🚀 مسار سباق الصواريخ (خط النهاية عند ${gs.questions.length} خطوات)</div>
                ${gs.participants.map((p, idx) => {
                  const pct = Math.min(92, Math.round((p.steps / Math.max(1, gs.questions.length)) * 90));
                  const colors = ['bg-brand-500', 'bg-amber-400', 'bg-emerald-500', 'bg-sky-500', 'bg-pink-500', 'bg-orange-500'];
                  return `
                    <div class="space-y-1">
                      <div class="flex justify-between text-xs font-bold">
                        <span>${UI.escapeHtml(p.name)}</span>
                        <span class="text-amber-300">${p.score} ❤️</span>
                      </div>
                      <div class="h-8 bg-slate-800 rounded-full relative overflow-hidden flex items-center px-2">
                        <div class="h-5 ${colors[idx % colors.length]} rounded-full transition-all duration-500" style="width:${Math.max(8, pct)}%"></div>
                        <span class="text-xl -mr-3 transition-all duration-500">🚀</span>
                        <span class="absolute left-3 text-sm">🏁</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                ${gs.participants.map((p, idx) => `
                  <div class="p-3 rounded-2xl border ${idx === (gs.turnIndex % gs.participants.length) ? 'bg-brand-800 border-amber-400' : 'bg-slate-900 border-white/10'} flex items-center justify-between">
                    <span class="font-extrabold text-sm truncate">${UI.escapeHtml(p.name)}</span>
                    <span class="px-2.5 py-0.5 rounded-lg bg-rose-500/20 text-rose-300 font-black text-xs">${p.score} ❤️</span>
                  </div>
                `).join('')}
              </div>
            `}

            <!-- Game Stage: Box Grid OR Active Question -->
            ${gs.gameType === 'box' && !gs.currentQuestion ? `
              <div class="space-y-4">
                <h3 class="text-center text-xl font-black text-amber-300">اختر صندوقًا من الصناديق التالية يا ${UI.escapeHtml(currentTurn.name)}:</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                  ${gs.questions.map((q, idx) => {
                    const opened = gs.openedBoxes.includes(idx);
                    return `
                      <button onclick="GamesModule.openBox(${idx})" ${opened ? 'disabled' : ''}
                        class="box-card h-28 rounded-3xl font-black text-3xl flex flex-col items-center justify-center shadow-lg ${opened ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-gradient-to-br from-amber-400 to-amber-600 text-brand-950'}">
                        <span>${opened ? '✓' : idx + 1}</span>
                        <span class="text-xs font-bold mt-1">${opened ? 'تم فتحه' : 'افتح الصندوق'}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
                ${gs.openedBoxes.length === gs.questions.length ? `
                  <div class="text-center pt-4">
                    <div class="text-2xl font-black text-emerald-400 mb-3">🎉 انتهت جميع الصناديق!</div>
                    <button onclick="App.gameState.active=false; App.renderCurrentView()" class="px-6 py-3 rounded-2xl bg-amber-400 text-brand-950 font-black">العودة</button>
                  </div>
                ` : ''}
              </div>
            ` : this.renderQuestionStage()}
          </div>
        `;
      },

      openBox(idx) {
        const gs = App.gameState;
        if (gs.openedBoxes.includes(idx)) return;
        gs.openedBoxes.push(idx);
        gs.currentQuestion = gs.questions[idx];
        gs.selectedOption = null;
        gs.revealed = false;
        SoundFX.play('tick');
        App.renderCurrentView();
      },

      renderQuestionStage() {
        const gs = App.gameState;
        const q = gs.currentQuestion;
        if (!q) {
          return `
            <div class="text-center py-8 space-y-4">
              <div class="text-3xl font-black text-amber-300">🏆 انتهت جولات المسابقة!</div>
              <button onclick="App.gameState.active=false; App.renderCurrentView()" class="px-6 py-3 rounded-2xl bg-amber-400 text-brand-950 font-black">إنهاء وعرض النتائج</button>
            </div>
          `;
        }

        return `
          <div class="bg-slate-900 p-6 rounded-3xl border border-white/10 space-y-5">
            <div class="text-2xl md:text-3xl font-black text-white leading-relaxed text-center py-2">
              ${UI.escapeHtml(q.text)}
            </div>

            <!-- Options (Do NOT show correct answer before teacher confirms!) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${q.options.map((opt, idx) => {
                let cls = 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-white';
                if (!gs.revealed && gs.selectedOption === idx) {
                  cls = 'bg-amber-400 text-brand-950 border-white scale-[1.01]';
                } else if (gs.revealed) {
                  if (idx === q.correctIndex) cls = 'bg-emerald-600 border-emerald-300 text-white';
                  else if (idx === gs.selectedOption) cls = 'bg-rose-600 border-rose-300 text-white';
                  else cls = 'bg-slate-800/50 border-slate-800 text-slate-400';
                }
                return `
                  <button onclick="GamesModule.selectOption(${idx})" ${gs.revealed ? 'disabled' : ''}
                    class="p-4 rounded-2xl border-2 font-extrabold text-lg text-right transition ${cls}">
                    ${UI.escapeHtml(opt)}
                  </button>
                `;
              }).join('')}
            </div>

            ${gs.revealed && q.explanation ? `
              <div class="p-3.5 rounded-2xl bg-brand-900/70 border border-brand-500/40 text-sm text-brand-100">
                <b>التوضيح:</b> ${UI.escapeHtml(q.explanation)}
              </div>
            ` : ''}

            <div class="flex justify-center gap-3 pt-2">
              ${!gs.revealed ? `
                <button onclick="GamesModule.confirmAnswer()" ${gs.selectedOption === null ? 'disabled' : ''}
                  class="px-8 py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 text-slate-950 font-black text-lg">
                  اعتماد الإجابة وكشف النتيجة
                </button>
              ` : `
                <button onclick="GamesModule.nextTurn()" class="px-8 py-3.5 rounded-2xl bg-amber-400 hover:bg-amber-300 text-brand-950 font-black text-lg">
                  السؤال / الدور التالي ←
                </button>
              `}
            </div>
          </div>
        `;
      },

      selectOption(idx) {
        App.gameState.selectedOption = idx;
        App.renderCurrentView();
      },

      confirmAnswer() {
        const gs = App.gameState;
        const q = gs.currentQuestion;
        if (!q || gs.selectedOption === null || gs.revealed) return;
        gs.revealed = true;

        const isCorrect = gs.selectedOption === q.correctIndex;
        const participant = gs.participants[gs.turnIndex % gs.participants.length];

        if (isCorrect) {
          participant.score += gs.pointsPerQ;
          participant.steps += 1;
          // Award real Hearts to student(s) using the exact group/individual rule
          App.awardHearts({
            studentIds: participant.studentIds,
            delta: gs.pointsPerQ,
            reason: `إجابة صحيحة في لعبة (${gs.gameType === 'box' ? 'افتح الصندوق' : gs.gameType === 'race' ? 'سباق الصواريخ' : 'المسابقات'})`,
            source: 'لعبة'
          });
          SoundFX.play('win');
          if (!App.state.settings.reduceMotion && window.confetti) {
            confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
          }
          UI.toast(`إجابة صحيحة! +${gs.pointsPerQ} قلوب ❤️ لـ ${participant.name}`, 'success');
        } else {
          SoundFX.play('wrong');
          UI.toast('إجابة غير صحيحة — حظًا أوفر في الجولة القادمة', 'warning');
        }
        App.renderCurrentView();
      },

      nextTurn() {
        const gs = App.gameState;
        gs.turnIndex += 1;
        gs.selectedOption = null;
        gs.revealed = false;
        if (gs.gameType === 'box') {
          gs.currentQuestion = null;
        } else {
          gs.qIndex += 1;
          gs.currentQuestion = gs.questions[gs.qIndex] || null;
        }
        App.renderCurrentView();
      }
    };

    /* --- 6.6 Heart Points & Mobile/Tablet QR Camera Scanner --- */
    const QRScannerModule = {
      _stream: null,
      _raf: null,
      _qrHearts: 5,
      _qrReason: 'مشاركة متميزة',
      _lastScannedToken: null,
      _lastScanTime: 0,

      render(el) {
        const students = App.getClassStudents(App.activeClassId);

        el.innerHTML = `
          <div class="flex flex-col gap-4 p-4">
            <!-- Top: QR Camera Scanner -->
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-black text-slate-900 flex items-center gap-1.5">
                  <i data-lucide="scan-line" class="w-4 h-4 text-brand-700"></i>
                  <span>كاميرا QR</span>
                </h3>
              </div>

              <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                  <label class="text-[10px] font-bold text-slate-600 w-10">قلوب ❤️</label>
                  <select onchange="QRScannerModule._qrHearts=parseInt(this.value)" class="flex-1 p-1.5 rounded-lg border border-slate-200 font-extrabold text-xs bg-white">
                    ${[1, 2, 5, 10, 15, 20].map(v => `<option value="${v}" ${this._qrHearts === v ? 'selected' : ''}>+${v}</option>`).join('')}
                  </select>
                </div>
                <div class="flex items-center gap-2">
                  <label class="text-[10px] font-bold text-slate-600 w-10">السبب</label>
                  <select onchange="QRScannerModule._qrReason=this.value" class="flex-1 p-1.5 rounded-lg border border-slate-200 font-bold text-xs bg-white">
                    ${['مشاركة متميزة', 'إجابة صحيحة', 'تعاون وانضباط', 'إنجاز مهمة', 'مبادرة إبداعية'].map(r =>
                      `<option value="${r}" ${this._qrReason === r ? 'selected' : ''}>${r}</option>`
                    ).join('')}
                  </select>
                </div>
              </div>

              <!-- Camera Viewport -->
              <div class="relative rounded-2xl overflow-hidden bg-slate-900 aspect-square max-h-56 mx-auto flex items-center justify-center">
                <video id="qr-video" playsinline class="w-full h-full object-cover hidden"></video>
                <canvas id="qr-hidden-canvas" class="hidden"></canvas>
                <div id="qr-placeholder" class="text-center p-4 space-y-2">
                  <i data-lucide="camera" class="w-10 h-10 text-amber-400 mx-auto"></i>
                  <p class="text-[10px] text-slate-300">مسح بطاقة الطالب لإضافة القلوب فورًا</p>
                  <button onclick="QRScannerModule.startCamera()" class="px-4 py-2 rounded-xl bg-amber-400 text-brand-950 font-black text-xs">
                    تشغيل
                  </button>
                </div>
              </div>
              <div id="qr-scan-result" class="hidden"></div>
            </div>

            <!-- Bottom: Quick Manual Award -->
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex flex-col gap-1">
                <h3 class="text-sm font-black text-slate-900">النقاط اليدوية</h3>
              </div>

              <div class="flex flex-col gap-2 max-h-[40vh] overflow-y-auto pr-1">
                ${students.length === 0 ? `<p class="text-xs text-slate-400 text-center">لا يوجد طلاب.</p>` :
                  students.map(stu => {
                    const hearts = App.getStudentHearts(stu.id);
                    return `
                      <div class="p-2.5 rounded-xl border border-slate-200 hover:border-brand-300 bg-slate-50/70 flex items-center justify-between gap-1">
                        <div class="min-w-0">
                          <div class="font-extrabold text-slate-900 text-xs truncate">${UI.escapeHtml(stu.name)}</div>
                          <div class="text-[10px] font-black text-rose-600 mt-0.5">${hearts} ❤️</div>
                        </div>
                        <div class="flex flex-col gap-1 shrink-0">
                          <button onclick="QRScannerModule.quickAward('${stu.id}', 1, 'مشاركة')" class="px-2 py-1 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-black text-[10px]">+1</button>
                          <button onclick="QRScannerModule.quickAward('${stu.id}', 5, 'إجابة صحيحة')" class="px-2 py-1 rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-black text-[10px]">+5</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      quickAward(studentId, delta, reason) {
        const stu = App.state.students.find(s => s.id === studentId);
        if (!stu) return;
        const ok = App.awardHearts({
          studentIds: [studentId],
          delta,
          reason,
          source: 'يدوي',
          idempotencyKey: `man_${studentId}_${delta}_${Math.floor(Date.now() / 600)}`
        });
        if (ok) {
          UI.toast(`+${delta} ❤️ لـ ${stu.name}`, 'success');
          App.renderCurrentView();
        }
      },

      async startCamera() {
        try {
          const video = document.getElementById('qr-video');
          const placeholder = document.getElementById('qr-placeholder');
          if (!video) return;
          this._stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          video.srcObject = this._stream;
          await video.play();
          video.classList.remove('hidden');
          if (placeholder) placeholder.classList.add('hidden');
          this.scanLoop();
        } catch (e) {
          UI.toast('تعذر فتح الكاميرا — تأكد من منح الإذن أو استخدم الاختيار اليدوي', 'warning');
        }
      },

      stopCamera() {
        if (this._raf) cancelAnimationFrame(this._raf);
        if (this._stream) {
          this._stream.getTracks().forEach(t => t.stop());
          this._stream = null;
        }
      },

      scanLoop() {
        const video = document.getElementById('qr-video');
        const canvas = document.getElementById('qr-hidden-canvas');
        if (!video || !canvas || !this._stream) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
          if (code && code.data) {
            this.handleScannedToken(code.data.trim());
          }
        }
        this._raf = requestAnimationFrame(() => this.scanLoop());
      },

      handleScannedToken(token) {
        const now = Date.now();
        if (token === this._lastScannedToken && (now - this._lastScanTime) < 3500) {
          return;
        }
        this._lastScannedToken = token;
        this._lastScanTime = now;

        const student = App.state.students.find(s => s.qrToken === token);
        const resBox = document.getElementById('qr-scan-result');
        if (!student) {
          if (resBox) {
            resBox.classList.remove('hidden');
            resBox.innerHTML = `<div class="p-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-[10px] font-bold">⚠️ رمز غير مسجل.</div>`;
          }
          return;
        }

        if (student.classId !== App.activeClassId) {
          UI.toast('⚠️ تنبيه: تم مسح بطاقة طالب من فصل مختلف!', 'warning');
        }

        // تسجيل النقاط فوراً بدون رسالة تأكيد
        this.confirmQrAward(student.id);
      },

      confirmQrAward(studentId) {
        const stu = App.state.students.find(s => s.id === studentId);
        if (!stu) return;
        const ok = App.awardHearts({
          studentIds: [studentId],
          delta: this._qrHearts,
          reason: this._qrReason,
          source: 'QR',
          idempotencyKey: `qr_${studentId}_${Math.floor(Date.now() / 3000)}`
        });
        if (ok) {
          UI.toast(`تمت إضافة ${this._qrHearts} قلوب ❤️ لـ ${stu.name} عبر QR`, 'success');
          const resBox = document.getElementById('qr-scan-result');
          if (resBox) resBox.classList.add('hidden');
          App.renderCurrentView();
        }
      },

      printSingleCard(studentId) {
        const stu = App.state.students.find(s => s.id === studentId);
        if (stu) this.renderPrintCards([stu]);
      },

      printClassCards(classId) {
        const list = App.getClassStudents(classId);
        if (list.length === 0) return UI.toast('لا يوجد طلاب لطباعة بطاقاتهم', 'warning');
        this.renderPrintCards(list);
      },

      renderPrintCards(students) {
        const area = document.getElementById('print-area');
        area.innerHTML = `
          <div style="font-family:'Cairo',sans-serif; direction:rtl;">
            <h2 style="text-align:center; margin-bottom:16px; font-weight:900;">بطاقات الطلاب الذكية (QR) — ${UI.escapeHtml(App.state.settings.platformName)}</h2>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;">
              ${students.map(s => {
                const cls = App.state.classes.find(c => c.id === s.classId);
                return `
                  <div style="border:2px solid #5b21b6; border-radius:16px; padding:14px; text-align:center; break-inside:avoid;">
                    <div style="font-weight:900; font-size:15px; color:#2e1065; margin-bottom:4px;">${UI.escapeHtml(s.name)}</div>
                    <div style="font-size:12px; color:#6d28d9; margin-bottom:10px;">${cls ? UI.escapeHtml(cls.name) : ''}</div>
                    <div id="qr-img-${s.id}" style="display:flex; justify-content:center; margin:8px 0;"></div>
                    <div style="font-size:10px; color:#64748b; font-family:monospace;">${s.id.slice(-6).toUpperCase()}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        students.forEach(s => {
          const box = document.getElementById(`qr-img-${s.id}`);
          if (box && window.QRCode) {
            new QRCode(box, { text: s.qrToken, width: 115, height: 115, correctLevel: QRCode.CorrectLevel.M });
          }
        });
        setTimeout(() => window.print(), 350);
      }
    };

    /* ==========================================================================
       7. SECTION 3: «الإنجازات» (LEADERBOARD PODIUM, CHARTS, LEDGER, CERTIFICATES)
       ========================================================================== */
    const AchievementsView = {
      _boardTarget: 'students', // 'students' | 'groups'
      _boardDisplay: 'podium',  // 'podium' | 'chart'
      _periodFilter: 'all',     // 'lesson' | 'week' | 'month' | 'all'

      render(container) {
        const tabs = [
          { id: 'board', label: 'الصدارة ومدرج الأبطال', icon: 'trophy' },
          { id: 'log', label: 'سجل القلوب ❤️', icon: 'list-ordered' },
          { id: 'certificates', label: 'شهادات التميز', icon: 'award' }
        ];

        container.innerHTML = `
          <div class="space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-2xl md:text-3xl font-black text-slate-900">الإنجازات ولوحة الشرف</h2>
                <p class="text-slate-500 text-sm">متابعة القلوب ❤️ وترتيب الطلاب والمجموعات وإصدار شهادات التميز</p>
              </div>
              <div class="flex gap-2 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm">
                ${tabs.map(t => `
                  <button onclick="App.achSubTab='${t.id}'; App.renderCurrentView()"
                    class="px-4 py-2 rounded-xl font-extrabold text-sm flex items-center gap-2 transition ${App.achSubTab === t.id ? 'bg-brand-700 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
                    <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                    <span>${t.label}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div id="ach-sub-content"></div>
          </div>
        `;

        const sub = document.getElementById('ach-sub-content');
        if (App.achSubTab === 'board') this.renderLeaderboard(sub);
        else if (App.achSubTab === 'log') this.renderLedger(sub);
        else if (App.achSubTab === 'certificates') CertificatesModule.render(sub);
      },

      getRankedItems() {
        const classId = App.activeClassId;
        let items = [];
        if (this._boardTarget === 'students') {
          items = App.getClassStudents(classId).map(s => ({
            id: s.id,
            name: s.name,
            hearts: App.getStudentHearts(s.id, this._periodFilter)
          }));
        } else {
          const groups = App.state.groupsByClass[classId] || [];
          items = groups.map(g => ({
            id: g.id,
            name: g.name,
            hearts: App.getGroupHearts(g, this._periodFilter)
          }));
        }

        items.sort((a, b) => b.hearts - a.hearts);
        // Equal ranking for ties
        let rank = 1;
        items.forEach((it, idx) => {
          if (idx > 0 && it.hearts < items[idx - 1].hearts) {
            rank = idx + 1;
          }
          it.rank = rank;
        });
        return items;
      },

      renderLeaderboard(el) {
        const items = this.getRankedItems();
        const top3 = items.slice(0, 3);
        const maxHearts = Math.max(1, ...items.map(i => i.hearts));

        el.innerHTML = `
          <div class="space-y-6">
            <!-- Filters Bar -->
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap gap-2">
                <button onclick="AchievementsView._boardTarget='students'; App.renderCurrentView()" class="px-4 py-2 rounded-xl text-xs font-extrabold ${this._boardTarget === 'students' ? 'bg-brand-700 text-white' : 'bg-slate-100 text-slate-700'}">ترتيب الطلاب</button>
                <button onclick="AchievementsView._boardTarget='groups'; App.renderCurrentView()" class="px-4 py-2 rounded-xl text-xs font-extrabold ${this._boardTarget === 'groups' ? 'bg-brand-700 text-white' : 'bg-slate-100 text-slate-700'}">ترتيب المجموعات</button>
              </div>

              <div class="flex flex-wrap gap-1.5">
                ${[
                  { id: 'lesson', label: 'الحصة الحالية' },
                  { id: 'week', label: 'هذا الأسبوع' },
                  { id: 'month', label: 'هذا الشهر' },
                  { id: 'all', label: 'الإجمالي الكلي' }
                ].map(f => `
                  <button onclick="AchievementsView._periodFilter='${f.id}'; App.renderCurrentView()"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold ${this._periodFilter === f.id ? 'bg-amber-400 text-brand-950 font-extrabold' : 'bg-slate-100 text-slate-600'}">
                    ${f.label}
                  </button>
                `).join('')}
              </div>

              <div class="flex gap-1.5">
                <button onclick="AchievementsView._boardDisplay='podium'; App.renderCurrentView()" class="px-3.5 py-2 rounded-xl text-xs font-bold ${this._boardDisplay === 'podium' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">🏆 لوحة شرف ومدرج</button>
                <button onclick="AchievementsView._boardDisplay='chart'; App.renderCurrentView()" class="px-3.5 py-2 rounded-xl text-xs font-bold ${this._boardDisplay === 'chart' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">📊 أعمدة بيانية</button>
              </div>
            </div>

            ${items.length === 0 ? `
              <div class="bg-white p-10 rounded-3xl border border-slate-200 text-center font-bold text-slate-400">لا توجد بيانات لعرضها في هذا الفصل.</div>
            ` : (this._boardDisplay === 'podium' ? `
              <!-- Top 3 Podium Stage -->
              <div class="bg-gradient-to-b from-brand-900 to-brand-950 text-white p-6 md:p-8 rounded-3xl shadow-xl">
                <h3 class="text-center text-amber-400 font-black text-xl mb-6">🏅 مدرج المراكز الأولى</h3>
                <div class="grid grid-cols-3 gap-3 md:gap-6 items-end max-w-2xl mx-auto pt-4">
                  <!-- 2nd Place -->
                  <div class="text-center">
                    ${top3[1] ? `
                      <div class="font-extrabold text-sm md:text-base truncate mb-1">${UI.escapeHtml(top3[1].name)}</div>
                      <div class="text-amber-300 font-black text-xs mb-2">${top3[1].hearts} ❤️</div>
                      <div class="h-28 bg-slate-300/20 border-t-4 border-slate-300 rounded-t-2xl flex items-center justify-center text-3xl font-black">2</div>
                    ` : '<div class="h-28"></div>'}
                  </div>
                  <!-- 1st Place -->
                  <div class="text-center">
                    ${top3[0] ? `
                      <div class="text-3xl mb-1">👑</div>
                      <div class="font-black text-base md:text-lg text-amber-300 truncate mb-1">${UI.escapeHtml(top3[0].name)}</div>
                      <div class="text-white font-black text-sm mb-2">${top3[0].hearts} ❤️</div>
                      <div class="h-36 bg-amber-400/25 border-t-4 border-amber-400 rounded-t-2xl flex items-center justify-center text-4xl font-black text-amber-300">1</div>
                    ` : ''}
                  </div>
                  <!-- 3rd Place -->
                  <div class="text-center">
                    ${top3[2] ? `
                      <div class="font-extrabold text-sm md:text-base truncate mb-1">${UI.escapeHtml(top3[2].name)}</div>
                      <div class="text-amber-300 font-black text-xs mb-2">${top3[2].hearts} ❤️</div>
                      <div class="h-20 bg-amber-700/30 border-t-4 border-amber-600 rounded-t-2xl flex items-center justify-center text-2xl font-black">3</div>
                    ` : '<div class="h-20"></div>'}
                  </div>
                </div>
              </div>

              <!-- Full Honour Roll Cards -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                ${items.map(it => `
                  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="w-9 h-9 rounded-xl ${it.rank === 1 ? 'bg-amber-400 text-brand-950' : 'bg-brand-50 text-brand-800'} font-black flex items-center justify-center shrink-0">
                        ${it.rank}
                      </span>
                      <span class="font-extrabold text-slate-900 truncate">${UI.escapeHtml(it.name)}</span>
                    </div>
                    <span class="font-black text-rose-600 text-base shrink-0">${it.hearts} ❤️</span>
                  </div>
                `).join('')}
              </div>
            ` : `
              <!-- Bar Chart View -->
              <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="font-extrabold text-slate-900">الرسم البياني للقلوب ❤️</h3>
                <div class="space-y-3">
                  ${items.map(it => {
                    const widthPct = Math.max(4, Math.round((it.hearts / maxHearts) * 100));
                    return `
                      <div class="space-y-1">
                        <div class="flex justify-between text-xs font-extrabold">
                          <span>#${it.rank} — ${UI.escapeHtml(it.name)}</span>
                          <span class="text-rose-600">${it.hearts} ❤️</span>
                        </div>
                        <div class="h-5 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full bg-gradient-to-l from-brand-600 to-amber-400 rounded-full transition-all duration-500" style="width:${widthPct}%"></div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `)}
          </div>
        `;
      },

      renderLedger(el) {
        const logs = App.state.heartLedger.slice(0, 80);
        el.innerHTML = `
          <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-extrabold text-slate-900">سجل عمليات القلوب ❤️ (آخر 80 عملية)</h3>
              <span class="text-xs text-slate-500">التراجع يسجل قيدًا عكسيًا دون حذف التاريخ</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-right border-collapse text-sm">
                <thead>
                  <tr class="border-b border-slate-200 text-xs font-extrabold text-slate-500">
                    <th class="py-2.5 px-3">الطالب</th>
                    <th class="py-2.5 px-3">القلوب</th>
                    <th class="py-2.5 px-3">السبب</th>
                    <th class="py-2.5 px-3">المصدر</th>
                    <th class="py-2.5 px-3">الوقت</th>
                    <th class="py-2.5 px-3">إجراء</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${logs.length === 0 ? `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-bold">السجل فارغ حتى الآن.</td></tr>` :
                    logs.map(tx => {
                      const stu = App.state.students.find(s => s.id === tx.studentId);
                      const timeStr = new Date(tx.timestamp).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                      return `
                        <tr class="hover:bg-slate-50">
                          <td class="py-2.5 px-3 font-extrabold text-slate-900">${stu ? UI.escapeHtml(stu.name) : 'طالب محذوف'}</td>
                          <td class="py-2.5 px-3 font-black ${tx.delta >= 0 ? 'text-rose-600' : 'text-slate-500'}">${tx.delta >= 0 ? '+' + tx.delta : tx.delta} ❤️</td>
                          <td class="py-2.5 px-3 text-slate-700 font-semibold">${UI.escapeHtml(tx.reason)}</td>
                          <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded-lg bg-slate-100 text-xs font-bold">${UI.escapeHtml(tx.source)}</span></td>
                          <td class="py-2.5 px-3 text-xs text-slate-500">${timeStr}</td>
                          <td class="py-2.5 px-3">
                            ${!tx.isReversal && !tx.reversed ? `
                              <button onclick="App.undoTransactionGroup('${tx.txGroupId}')" class="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 hover:bg-amber-100 text-xs font-bold">
                                تراجع
                              </button>
                            ` : `<span class="text-[11px] text-slate-400">مُعالج</span>`}
                          </td>
                        </tr>
                      `;
                    }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    };

    /* --- 7.2 Certificates of Excellence --- */
    const CertificatesModule = {
      _template: 'gold',
      _selectedIds: new Set(),
      _customBody: 'تتقدم إدارة المادة بخالص التهنئة والتقدير للطالب/ة المتميز/ة نظير تفوقه وتفاعله الإيجابي وحصده أعلى رصيد من القلوب التحفيزية، متمنين له دوام التوفيق والنجاح.',

      render(el) {
        const students = App.getClassStudents(App.activeClassId);
        const teacher = App.state.settings.teacherName || 'معلم المادة';
        const school = App.state.settings.schoolName || '';
        const subject = App.state.subjects.find(s => s.id === App.activeSubjectId)?.name || 'المادة الدراسية';
        const dateStr = new Intl.DateTimeFormat('ar-SA', { dateStyle: 'long' }).format(new Date());

        const previewStu = students.find(s => this._selectedIds.has(s.id)) || students[0] || { name: 'اسم الطالب المتميز' };

        el.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Controls -->
            <div class="lg:col-span-5 bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <h3 class="text-lg font-black text-slate-900">إعداد شهادات التميز</h3>

              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">القالب التصميمي</label>
                <div class="grid grid-cols-3 gap-2">
                  ${[
                    { id: 'gold', label: 'كلاسيكي ذهبي' },
                    { id: 'purple', label: 'عصري بنفسجي' },
                    { id: 'emerald', label: 'علمي أنيق' }
                  ].map(t => `
                    <button onclick="CertificatesModule._template='${t.id}'; App.renderCurrentView()"
                      class="py-2 px-2 rounded-xl text-xs font-extrabold border ${this._template === t.id ? 'bg-brand-700 text-white border-brand-700' : 'bg-slate-50 text-slate-700 border-slate-200'}">
                      ${t.label}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">نص الشهادة القابل للتعديل</label>
                <textarea rows="3" oninput="CertificatesModule._customBody=this.value; CertificatesModule.updatePreviewText()" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs leading-relaxed font-semibold">${UI.escapeHtml(this._customBody)}</textarea>
              </div>

              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-slate-700">اختر المستحقين (${this._selectedIds.size}):</span>
                <button onclick="CertificatesModule.nominateTop3()" class="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-lg hover:bg-amber-100">
                  ترشيح أعلى 3 في القلوب ❤️
                </button>
              </div>

              <div class="max-h-48 overflow-y-auto border border-slate-200 rounded-2xl divide-y">
                ${students.map(s => `
                  <label class="flex items-center justify-between p-2.5 text-xs hover:bg-slate-50 cursor-pointer">
                    <div class="flex items-center gap-2">
                      <input type="checkbox" ${this._selectedIds.has(s.id) ? 'checked' : ''} onchange="CertificatesModule.toggleStu('${s.id}')" class="w-4 h-4 accent-brand-700" />
                      <span class="font-bold text-slate-800">${UI.escapeHtml(s.name)}</span>
                    </div>
                    <span class="font-black text-rose-600">${App.getStudentHearts(s.id)} ❤️</span>
                  </label>
                `).join('')}
              </div>

              <button onclick="CertificatesModule.printCertificates()" class="w-full py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-black text-sm shadow-lg flex items-center justify-center gap-2">
                <i data-lucide="printer" class="w-5 h-5"></i>
                <span>طباعة / حفظ PDF للشهادات المحددة</span>
              </button>
            </div>

            <!-- Live Preview -->
            <div class="lg:col-span-7 bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-400 mb-3">معاينة حية للشهادة:</div>
              <div id="cert-preview-box">
                ${this.buildCertHtml(previewStu.name, teacher, school, subject, dateStr)}
              </div>
            </div>
          </div>
        `;
      },

      toggleStu(id) {
        if (this._selectedIds.has(id)) this._selectedIds.delete(id);
        else this._selectedIds.add(id);
        App.renderCurrentView();
      },

      nominateTop3() {
        const ranked = AchievementsView.getRankedItems().slice(0, 3);
        this._selectedIds.clear();
        ranked.forEach(r => this._selectedIds.add(r.id));
        App.renderCurrentView();
        UI.toast('تم ترشيح أصحاب المراكز الثلاثة الأولى', 'success');
      },

      updatePreviewText() {
        const el = document.getElementById('cert-body-preview');
        if (el) el.textContent = this._customBody;
      },

      buildCertHtml(studentName, teacher, school, subject, dateStr) {
        const styles = {
          gold: { border: '#d97706', bg: 'linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%)', title: '#92400e', accent: '#b45309' },
          purple: { border: '#6d28d9', bg: 'linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%)', title: '#4c1d95', accent: '#7c3aed' },
          emerald: { border: '#059669', bg: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', title: '#065f46', accent: '#047857' }
        };
        const st = styles[this._template] || styles.gold;

        return `
          <div style="border:6px double ${st.border}; background:${st.bg}; border-radius:24px; padding:32px; text-align:center; font-family:'Cairo',sans-serif; direction:rtl;">
            ${school ? `<div style="font-size:13px; font-weight:700; color:${st.accent}; margin-bottom:4px;">${UI.escapeHtml(school)}</div>` : ''}
            <div style="font-size:12px; font-weight:700; color:#64748b;">${UI.escapeHtml(App.state.settings.platformName)}</div>
            <h2 style="font-size:30px; font-weight:900; color:${st.title}; margin:12px 0;">شهادة شكر وتفوق</h2>
            <div style="font-size:14px; color:#475569; margin-bottom:8px;">تُمنح بكل فخر واعتزاز إلى الطالب/ة:</div>
            <div style="font-size:26px; font-weight:900; color:#0f172a; border-bottom:2px solid ${st.border}; display:inline-block; padding:0 24px 6px; margin-bottom:16px;">
              ${UI.escapeHtml(studentName)}
            </div>
            <p id="cert-body-preview" style="font-size:15px; line-height:1.9; color:#334155; max-width:540px; margin:0 auto 24px;">
              ${UI.escapeHtml(this._customBody)}
            </p>
            <div style="display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:1px solid rgba(0,0,0,0.08); font-size:13px; font-weight:700; color:#1e293b;">
              <div>المادة: ${UI.escapeHtml(subject)}</div>
              <div>التاريخ: ${UI.escapeHtml(dateStr)}</div>
              <div>المعلم/ة: ${UI.escapeHtml(teacher)}</div>
            </div>
          </div>
        `;
      },

      printCertificates() {
        const students = App.getClassStudents(App.activeClassId).filter(s => this._selectedIds.has(s.id));
        if (students.length === 0) return UI.toast('يرجى تحديد طالب واحد على الأقل لإصدار الشهادة', 'warning');

        const teacher = App.state.settings.teacherName || 'معلم المادة';
        const school = App.state.settings.schoolName || '';
        const subject = App.state.subjects.find(s => s.id === App.activeSubjectId)?.name || 'المادة الدراسية';
        const dateStr = new Intl.DateTimeFormat('ar-SA', { dateStyle: 'long' }).format(new Date());

        const area = document.getElementById('print-area');
        area.innerHTML = students.map((s, idx) => `
          <div class="${idx < students.length - 1 ? 'page-break' : ''}" style="padding:10mm 0;">
            ${this.buildCertHtml(s.name, teacher, school, subject, dateStr)}
          </div>
        `).join('');
        setTimeout(() => window.print(), 250);
      }
    };

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
